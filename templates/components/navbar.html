<!-- Menú de navegación reutilizable -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{{ url_for('inicio') }}">
            Arte Mostacilla
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('inicio') }}">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('productos') }}">
                        Productos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('clientes') }}">
                        Clientes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('proveedores') }}">
                        Proveedores
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('facturacion') }}">
                        Facturación
                    </a>
                </li>

                <!-- Opciones según el estado de la sesión -->
                {% if current_user.is_authenticated %}

                    <!-- Mostrar el nombre del usuario que inició sesión -->
                    <li class="nav-item">
                        <span class="nav-link">
                            👤 {{ current_user.nombre }}
                        </span>
                    </li>

                    <!-- Opción para cerrar sesión -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">
                            Cerrar sesión
                        </a>
                    </li>

                {% else %}

                    <!-- Opción para iniciar sesión -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">
                            Iniciar sesión
                        </a>
                    </li>

                    <!-- Opción para registrar un nuevo usuario -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('registro') }}">
                            Registrarse
                        </a>
                    </li>

                {% endif %}

            </ul>
        </div>

    </div>
</nav>
