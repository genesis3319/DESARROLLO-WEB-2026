<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Arte Mostacilla{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Encabezado -->
    <header class="text-center py-4">
        <h1>Arte Mostacilla - Bisutería Artesanal</h1>
        <p>Accesorios hechos a mano con creatividad y dedicación</p>
    </header>

    <!-- Menú de navegación reutilizable -->
     {% include "components/navbar.html" %}   

    <!-- Contenido de cada página -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página reutilizable -->
     {% include "components/footer.html" %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
